apiVersion: v1
kind: Service
metadata:
  name: finpay-frontweb
  labels:
    {{- include "finpay-frontweb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "finpay-frontweb.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
